<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Background / Container Gradient -->
    <linearGradient id="tankBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E88E5" />
      <stop offset="100%" stop-color="#0D47A1" />
    </linearGradient>
    
    <!-- Water / Heat Gradient -->
    <linearGradient id="hotWaterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF7043" />
      <stop offset="100%" stop-color="#D32F2F" />
    </linearGradient>

    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B0BEC5" />
      <stop offset="50%" stop-color="#ECEFF1" />
      <stop offset="100%" stop-color="#90A4AE" />
    </linearGradient>
    
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Badge Background -->
  <circle cx="128" cy="128" r="120" fill="url(#tankBg)" stroke="#90CAF9" stroke-width="4" />

  <!-- Hot Water Tank Body (Cylinder) -->
  <g transform="translate(0, 0)">
    <!-- Outer Tank Shell -->
    <rect x="76" y="58" width="104" height="140" rx="16" ry="16" fill="url(#metalGrad)" stroke="#37474F" stroke-width="4" />
    
    <!-- Tank Top Cap -->
    <ellipse cx="128" cy="58" rx="52" ry="12" fill="#CFD8DC" stroke="#37474F" stroke-width="4" />
    
    <!-- Tank Bottom Cap -->
    <ellipse cx="128" cy="198" rx="52" ry="12" fill="#90A4AE" stroke="#37474F" stroke-width="4" />

    <!-- Inner Fluid / Thermodynamic Core Indicator window -->
    <rect x="92" y="78" width="72" height="100" rx="8" ry="8" fill="#263238" opacity="0.8" />
    
    <!-- Hot Water Fill Level Inside Tank -->
    <path d="M 92 118 L 164 118 L 164 170 C 164 174.4 160.4 178 156 178 L 100 178 C 95.6 178 92 174.4 92 170 Z" fill="url(#hotWaterGrad)" filter="url(#glow)" />

    <!-- Temperature / Heating Waves Inside -->
    <path d="M 104 140 Q 116 130, 128 140 T 152 140" fill="none" stroke="#FFEB3B" stroke-width="3" stroke-linecap="round" opacity="0.9" />
    <path d="M 104 156 Q 116 146, 128 156 T 152 156" fill="none" stroke="#FFEB3B" stroke-width="3" stroke-linecap="round" opacity="0.9" />

    <!-- Thermometer / Heating Element Icon overlay in center -->
    <circle cx="128" cy="108" r="10" fill="#FF5722" stroke="#FFFFFF" stroke-width="2" />
    <path d="M 125 92 L 131 92 L 131 104 L 125 104 Z" fill="#FF5722" />
  </g>

  <!-- Inlet / Outlet Pipes on Top and Bottom -->
  <rect x="120" y="38" width="16" height="22" fill="#78909C" stroke="#37474F" stroke-width="3" rx="2" />
  <rect x="120" y="194" width="16" height="24" fill="#78909C" stroke="#37474F" stroke-width="3" rx="2" />
</svg>